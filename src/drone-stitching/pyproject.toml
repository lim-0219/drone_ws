[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-ground-stitch"
version = "0.1.0"
description = "Nine-frame planar drone mosaic with explicit local-ground coordinates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "opencv-python-headless>=4.8,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
drone-stitch = "drone_stitch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

